<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thandeka's Artisan Home Decor | Enquiry</title>
  <!-- Google Fonts used by css/style.css (Playfair Display for headings, Lato for body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER / NAVIGATION - same shared structure as every other page; "active" class marks Enquiry -->
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">Thandeka's Artisan Home Decor</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="enquiry.html" class="active">Enquiry</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation menu">&#9776;</button>
    </div>
  </header>

  <main>
    <section class="container">
      <h2>Product Enquiry</h2>
      <p>
        Have a question about a product, want to check stock, or need a custom order?
        Fill out the form below and we'll get back to you.
      </p>

      <!--
        Enquiry form. Each field is wrapped in a .form-group div (label + input) so
        css/style.css can apply consistent spacing/width to every field without
        needing separate rules per input. required attributes provide basic
        client-side validation (built into the browser) so the form cannot be
        submitted without a name, email, and enquiry type. The "Enquiry Type"
        dropdown lets the visitor tell the store up front whether they're asking
        about stock, a custom order, or something general, so the right person can
        follow up. The form does not currently submit anywhere (action="#") because
        there is no backend yet - real submission handling and JS-based validation
        are planned for Part 3.
      -->
      <form action="#" method="post">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
          <label for="enquiryType">Enquiry Type</label>
          <select id="enquiryType" name="enquiryType" required>
            <option value="">-- Please select --</option>
            <option value="stock">Stock Availability</option>
            <option value="custom">Custom Order</option>
            <option value="general">General Enquiry</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us which product you're interested in..."></textarea>
        </div>

        <button type="submit" class="btn">Submit Enquiry</button>
      </form>
      <!-- Note: form submission handling (backend/JS validation) will be implemented in Part 3 -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Thandeka's Artisan Home Decor. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
